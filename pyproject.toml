[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "weight-analysis"
version = "3.0.0"
description = "Independent, reproducible checkpoint weight geometry and spectral analyses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2,<3",
  "scipy>=1.13",
  "torch>=2.10",
  "safetensors>=0.4",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]
statistics = ["statsmodels>=0.14"]
visualization = ["matplotlib>=3.8"]

[project.scripts]
weight-analysis = "weight_analysis.cli:main"
weight-analysis-maintenance = "weight_analysis.maintenance.__main__:main"
weightspace = "weightspace.cli:main"
weightspace-parallel = "weightspace.parallel:main"
weightspace-reports = "weightspace.reports.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weight_analysis", "src/weightspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires real CUDA hardware; skipped when torch.cuda.is_available() is false"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
